name: Terraform Infrastructure

# APP-002: destructive and unguarded mutate paths are disabled.
# Plan may still run for review. Apply/destroy require APP-005 remote
# account/permission verification + immutable reviewed plan guard.
# Do not re-enable apply/destroy until that enforcement exists everywhere
# legacy workflows could mutate infrastructure.

on:
  workflow_dispatch:
    inputs:
      terraform_command:
        description: 'Terraform command to run (mutate paths disabled by APP-002)'
        required: true
        type: choice
        options:
          - plan
        default: plan
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

env:
  TF_VERSION: '1.9.0'
  WORKING_DIRECTORY: 'terraform'
  # APP-002: legacy apply path safely disabled pending APP-005 plan-guard enforcement
  APP002_APPLY_DISABLED: 'true'
  APP002_DESTROY_DISABLED: 'true'

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.event.before != null &&
       github.event.before != '' &&
       github.event.before != '0000000000000000000000000000000000000000') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_command == 'plan')

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
      TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_project_id: ${{ steps.validate-secrets.outputs.project_id }}
      TF_VAR_approved_hostname: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_app_url: ${{ secrets.APP_URL }}
      TF_VAR_site_url: ${{ secrets.SITE_URL || format('https://{0}', secrets.DOMAIN_NAME) }}
      TF_VAR_vercel_project_name: ${{ secrets.VERCEL_PROJECT_NAME }}
      TF_VAR_deployment_state_key: ${{ secrets.VERCEL_PROJECT_NAME }}
      TF_VAR_github_repo: ${{ secrets.GITHUB_REPO || github.repository }}
      TF_VAR_vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_name: ${{ secrets.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_enable_dns: 'false'
      TF_VAR_dns_provider: 'unresolved'
      TF_VAR_enable_email_routing: 'false'
      TF_VAR_create_cloudflare_zone: 'false'
      TF_VAR_enable_supabase_project_deletion: 'false'
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: APP-002 safety banner
        run: |
          echo "## APP-002 infrastructure guard" >> $GITHUB_STEP_SUMMARY
          echo "Apply and destroy are disabled until APP-005 enforces remote verification + immutable plan guard." >> $GITHUB_STEP_SUMMARY
          echo "DNS/email/zone defaults are fail-closed. Shared Supabase project is reference-only." >> $GITHUB_STEP_SUMMARY

      - name: Validate required secrets
        id: validate-secrets
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          TERRAFORM_STATE_PASSWORD: ${{ secrets.TERRAFORM_STATE_PASSWORD }}
        run: |
          missing_secrets=()
          if [ -n "$SUPABASE_URL" ]; then
            EXTRACTED_PROJECT_ID=$(echo "$SUPABASE_URL" | sed -E 's|https?://([^.]+)\.supabase\.co.*|\1|')
            if [ -n "$EXTRACTED_PROJECT_ID" ] && [ "$EXTRACTED_PROJECT_ID" != "$SUPABASE_URL" ]; then
              echo "project_id=$EXTRACTED_PROJECT_ID" >> $GITHUB_OUTPUT
            else
              missing_secrets+=("SUPABASE_URL (invalid format)")
            fi
          else
            missing_secrets+=("SUPABASE_URL")
          fi
          if [ -z "$VERCEL_API_TOKEN" ]; then missing_secrets+=("VERCEL_API_TOKEN"); fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then missing_secrets+=("SUPABASE_ANON_KEY"); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing_secrets+=("SUPABASE_SERVICE_ROLE_KEY"); fi
          if [ -z "$DOMAIN_NAME" ]; then missing_secrets+=("DOMAIN_NAME"); fi
          if [ -z "$VERCEL_PROJECT_NAME" ]; then missing_secrets+=("VERCEL_PROJECT_NAME"); fi
          if [ -z "$TERRAFORM_STATE_PASSWORD" ]; then missing_secrets+=("TERRAFORM_STATE_PASSWORD"); fi
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for plan"
            printf '%s\n' "${missing_secrets[@]}"
            exit 1
          fi
          echo "secrets_valid=true" >> $GITHUB_OUTPUT

      - name: Download Encrypted Terraform State
        if: github.event_name != 'pull_request'
        uses: badgerhobbs/terraform-state@v2
        id: download-state
        continue-on-error: true
        with:
          encryption_key: ${{ secrets.TERRAFORM_STATE_PASSWORD }}
          operation: download
          location: artifact
          directory: ${{ env.WORKING_DIRECTORY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -json tfplan > tfplan.json
        continue-on-error: true

      - name: APP-002 offline plan ownership guard
        if: steps.plan.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f examples/plan-ownership.example.json ]; then
            echo "::error::Missing ownership allowlist example"
            exit 1
          fi
          # Workflow must supply a real per-app ownership file in APP-005.
          # Until then, fail closed unless PLAN_OWNERSHIP_PATH is provided as a secret-free artifact path.
          if [ -z "${{ secrets.PLAN_OWNERSHIP_PATH }}" ] && [ ! -f "${{ github.workspace }}/app.plan-ownership.json" ]; then
            echo "::warning::No app.plan-ownership.json present; writing guard reminder (plan not approved for apply)"
            echo "APP-005 must verify remote accounts/permissions and pass ./scripts/validate-terraform-plan.sh before any apply." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          OWNERSHIP_FILE="${{ github.workspace }}/app.plan-ownership.json"
          ./scripts/validate-terraform-plan.sh --plan "${{ github.workspace }}/${{ env.WORKING_DIRECTORY }}/tfplan.json" --ownership "$OWNERSHIP_FILE"

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.WORKING_DIRECTORY }}/tfplan
            ${{ env.WORKING_DIRECTORY }}/tfplan.json
          retention-days: 7
          if-no-files-found: ignore

  apply:
    name: Terraform Apply (disabled APP-002)
    runs-on: ubuntu-latest
    needs: plan
    # Safely disable legacy apply path rather than leave an unguarded bypass.
    if: false
    steps:
      - name: Apply disabled
        run: |
          echo "APP-002/APP-005: terraform apply is disabled until remote verification + immutable plan guard are enforced."
          exit 1

  destroy:
    name: Terraform Destroy (disabled APP-002)
    runs-on: ubuntu-latest
    # Destroy permanently disabled for shared-project safety.
    if: false
    steps:
      - name: Destroy disabled
        run: |
          echo "APP-002: destroy entrypoint is disabled. Shared Supabase project and cross-app resources must not be removed by this template."
          exit 1
