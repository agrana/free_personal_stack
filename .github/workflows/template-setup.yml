name: Template Repository Setup (legacy guide)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - name: Show current setup path
        run: |
          printf '%s\n' '## Launch app' 'Use the README.md four-secret quickstart, then run **Actions → Launch app → Run workflow**.' 'Generated repositories keep their own name and immutable repository ID. No README rewriting or legacy setup dispatch is required.' >> "$GITHUB_STEP_SUMMARY"
