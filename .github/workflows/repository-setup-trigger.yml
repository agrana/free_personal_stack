name: Repository Setup Trigger (legacy guide)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - name: Show current setup path
        run: |
          printf '%s\n' '## Launch app' 'After adding the four repository secrets, run **Actions → Launch app → Run workflow**.' 'Saving GitHub Secrets does not emit a workflow event. This guide dispatches no workflows and changes no resources.' >> "$GITHUB_STEP_SUMMARY"
