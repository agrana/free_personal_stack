name: Deploy to Supabase

# APP-002 / APP-003: automatic migrations against the shared Supabase project
# are disabled until namespaced, reviewed migration automation (APP-003) exists.
# Leaving db push enabled would bypass the shared-database guard.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  SUPABASE_VERSION: '2.65.5'
  APP003_MIGRATIONS_DISABLED: 'true'

jobs:
  migrate:
    name: Run Database Migrations (disabled pending APP-003)
    runs-on: ubuntu-latest
    environment: production
    if: false
    steps:
      - name: Migrations disabled
        run: |
          echo "APP-002/APP-003: automatic shared DB migrations are disabled."
          echo "Do not re-enable supabase db push until APP-003 namespaced migration review exists."
          exit 1
