name: Deploy to Supabase

# APP-002 / APP-003: unattended migrations against the shared Supabase project
# remain disabled. APP-003 provides an app-scoped harness + local fixtures, but
# does not restore supabase db push / automatic main deploy migrations.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  SUPABASE_VERSION: '2.65.5'
  APP003_MIGRATIONS_DISABLED: 'true'

jobs:
  migrate:
    name: Run Database Migrations (disabled — no unattended main path)
    runs-on: ubuntu-latest
    environment: production
    if: false
    steps:
      - name: Migrations disabled
        run: |
          echo "APP-003: unattended shared DB migrations stay disabled."
          echo "Use reviewed app-scoped migrate_app_namespace with immutable SQL/checksums."
          echo "Do not re-enable supabase db push on main."
          exit 1
