name: Merge onboarding
on:
  push:
    branches: ['**']
permissions:
  contents: read
  actions: read
jobs:
  onboarding:
    # Job-level serialization: skipped feature-branch pushes must never replace
    # a queued default-branch deployment in GitHub's single-pending-run group.
    concurrency:
      group: app-provider-${{ github.repository_id }}
      cancel-in-progress: false
    if: >-
      github.repository_id != '1051601680' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.repository.fork == false &&
      github.event.repository.is_template == false
    runs-on: ubuntu-latest
    # Quality wait + shell + DNS/TLS verify window (up to ~20m) within one bound.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pinned deployment CLI
        run: npm install --prefix "$RUNNER_TEMP/launch-vercel" vercel@65.4.0 --ignore-scripts --no-audit --no-fund
      - name: Merge-driven shell deploy and hostname DNS
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/merge-onboarding-artifacts
        run: >-
          mkdir -p "$ARTIFACT_DIR"
          && python3 scripts/merge-onboarding.py --source "$GITHUB_WORKSPACE"
          --vercel-bin "$RUNNER_TEMP/launch-vercel/node_modules/.bin/vercel"
          --artifact-dir "$ARTIFACT_DIR"
      - name: Upload merge-onboarding artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-onboarding-${{ github.sha }}
          path: ${{ runner.temp }}/merge-onboarding-artifacts
          if-no-files-found: ignore
